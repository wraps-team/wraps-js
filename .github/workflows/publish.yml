name: Publish

on:
  release:
    types: [created]
  # Re-fire path for a release whose later steps failed. npm publish is
  # skipped when the version already exists (or when skip_npm is set), so
  # re-running just the MCP Registry step for an existing version (the
  # mcp-v0.8.0 400) no longer hits an npm version conflict. `ref` defaults
  # to the package's release tag so the tree (and server.json) matches the
  # version being re-published, not whatever main has moved on to.
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (email, sms, client, mcp)
        required: true
        type: choice
        options:
          - email
          - sms
          - client
          - mcp
      version:
        description: Exact semver to publish, e.g. 0.8.0
        required: true
        type: string
      skip_npm:
        description: Skip npm publish and only run the remaining steps
        required: false
        type: boolean
        default: false
      ref:
        description: Ref to check out (defaults to package-v-version)
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: github.event_name != 'workflow_dispatch'

      # Dispatch re-fires check out the release tag so server.json matches
      # the version being re-published even after main has bumped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || format('{0}-v{1}', inputs.package, inputs.version) }}

      - name: Install pnpm
        # Version intentionally omitted: the action reads `packageManager`
        # from package.json, keeping CI and local on one pinned pnpm.
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Determine package to publish
        id: package
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PACKAGE="${{ inputs.package }}"
            VERSION="${{ inputs.version }}"
            SKIP_NPM="${{ inputs.skip_npm }}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::version must be an exact semver like 0.8.0"
              exit 1
            fi
          else
            TAG="${{ github.event.release.tag_name }}"
            echo "Release tag: $TAG"
            SKIP_NPM="false"

            if [[ "$TAG" == email-v* ]]; then
              PACKAGE="email"
              VERSION="${TAG#email-v}"
            elif [[ "$TAG" == sms-v* ]]; then
              PACKAGE="sms"
              VERSION="${TAG#sms-v}"
            elif [[ "$TAG" == client-v* ]]; then
              PACKAGE="client"
              VERSION="${TAG#client-v}"
            elif [[ "$TAG" == mcp-v* ]]; then
              PACKAGE="mcp"
              VERSION="${TAG#mcp-v}"
            else
              echo "::error::Unknown release tag format: $TAG"
              echo "Expected format: email-vX.Y.Z, sms-vX.Y.Z, client-vX.Y.Z, or mcp-vX.Y.Z"
              exit 1
            fi
          fi

          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "skip_npm=$SKIP_NPM" >> $GITHUB_OUTPUT
          echo "npm_name=@wraps.dev/$PACKAGE" >> $GITHUB_OUTPUT

      - name: Verify package version matches tag
        run: |
          PACKAGE="${{ steps.package.outputs.package }}"
          TAG_VERSION="${{ steps.package.outputs.version }}"
          PKG_VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Version mismatch! Tag: $TAG_VERSION, package.json: $PKG_VERSION"
            exit 1
          fi

      # Uses npm OIDC Trusted Publishing - no NPM_TOKEN needed
      # Requires one-time setup on npmjs.com for each package:
      # 1. First publish must be done manually: npm publish --access public
      # 2. Then configure trusted publishing at:
      #    https://www.npmjs.com/package/@wraps.dev/<pkg>/access
      #    Add GitHub Actions: wraps-team/wraps-js, publish.yml
      # server.json carries the version twice (top level and in packages[0]).
      # Both must match package.json or the registry rejects the publish after
      # npm has already gone out — check before anything is published.
      - name: Verify server.json versions match
        if: steps.package.outputs.package == 'mcp'
        run: |
          node -e '
            const s = require("./packages/mcp/server.json");
            const tag = process.argv[1];
            const found = [["version", s.version], ["packages[0].version", s.packages[0].version]];
            const bad = found.filter(([, v]) => v !== tag);
            for (const [path, v] of bad) {
              console.error("::error::server.json " + path + " is " + v + ", expected " + tag);
            }
            if (bad.length) process.exit(1);
            console.log("server.json versions match " + tag);
          ' "${{ steps.package.outputs.version }}"

      # A dispatch re-fire can target a version that is already on npm;
      # publishing it again fails with EPUBLISHCONFLICT. Skip npm when the
      # version is already served (or when skip_npm is set) and run the
      # remaining steps against the existing version instead of stranding
      # the release.
      #
      # Dispatch only. `npm view` lags the registry by minutes after a publish,
      # so on a real `release: created` it can report a brand-new version as
      # absent-or-present unreliably. Letting it gate the publish on that path
      # risks silently skipping a genuine release while the job still goes
      # green, which is a worse failure than the EPUBLISHCONFLICT it avoids.
      # A release publishes unconditionally and lets the conflict be loud.
      - name: Check whether the npm version already exists
        id: npm-exists
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_NAME: ${{ steps.package.outputs.npm_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$NPM_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NPM_NAME@$VERSION already exists on npm; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ steps.package.outputs.package }} to npm
        if: steps.npm-exists.outputs.exists != 'true' && steps.package.outputs.skip_npm != 'true'
        run: |
          cd packages/${{ steps.package.outputs.package }}
          npm publish --access public --provenance

      # npm accepts a publish asynchronously — it answers "your package is being
      # processed and may take a few minutes to become available" and returns
      # success while the version is still 404 on the registry. The MCP Registry
      # validates that the version exists before registering it, so running it
      # straight after npm publish is a race, and it is the slow path that loses:
      # mcp-v0.8.0 failed here with "version '0.8.0' was not found (status: 404)"
      # after npm had already gone out, leaving npm and the registry disagreeing.
      - name: Wait for npm to serve the new version
        if: steps.package.outputs.package == 'mcp'
        env:
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          URL="https://registry.npmjs.org/@wraps.dev/mcp/$PKG_VERSION"
          for attempt in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [[ "$CODE" == "200" ]]; then
              echo "npm is serving $PKG_VERSION after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: npm returned $CODE for $PKG_VERSION, waiting..."
            sleep 10
          done
          echo "::error::npm did not serve $PKG_VERSION within 10 minutes."
          echo "The npm publish itself may have succeeded. Re-fire the registry"
          echo "steps only: Run workflow with package=mcp, version=$PKG_VERSION,"
          echo "and skip_npm=true, instead of re-running the whole job."
          exit 1

      # The registry validates that the published npm tarball carries the
      # matching `mcpName`, so this has to run after the npm publish above.
      - name: Publish to MCP Registry
        if: steps.package.outputs.package == 'mcp'
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          cd packages/mcp
          mcp-publisher login dns --domain wraps.dev --private-key "$MCP_DNS_PRIVATE_KEY"
          mcp-publisher publish
