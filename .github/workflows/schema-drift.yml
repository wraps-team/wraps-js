name: Schema Drift

permissions:
  actions: write
  contents: write
  pull-requests: write

on:
  schedule:
    # Mondays, 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        # Version intentionally omitted: the action reads `packageManager`
        # from package.json, keeping CI and local on one pinned pnpm.
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate client schema
        run: pnpm --filter @wraps.dev/client generate

      # The drift PR is opened with GITHUB_TOKEN, and PRs opened with
      # GITHUB_TOKEN do not trigger on: pull_request runs, so it would arrive
      # with no CI status. Verify the regenerated schema here, then dispatch CI
      # against the branch below so reviewers see the real checks too.
      - name: Typecheck and build against the regenerated schema
        run: |
          pnpm --filter @wraps.dev/client typecheck
          pnpm --filter @wraps.dev/client build

      - name: Open PR if the schema drifted
        id: drift-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # main requires signed commits. Committing over git with GITHUB_TOKEN
          # produces unsigned ones, so the PR can never satisfy the ruleset;
          # this commits via the API instead, which GitHub signs.
          sign-commits: true
          add-paths: packages/client/src/schema.d.ts
          branch: chore/client-schema-sync
          delete-branch: true
          # The ruleset requires an approving review and only stewartjarod is an
          # eligible approver. Requesting them at open time is what makes the
          # drift PR visible to the one person who can merge it.
          reviewers: stewartjarod
          commit-message: 'chore(client): sync schema with production API'
          title: 'chore(client): sync schema with production API'
          body: |
            `packages/client/src/schema.d.ts` has drifted from the live
            OpenAPI document at https://api.wraps.dev/swagger/json.

            **Read the diff before merging — it decides the next release bump:**

            - New paths, operations, or optional fields only → minor
            - Comment/annotation churn only → patch
            - Any removed or renamed path, operation, or required field → major

            `build` compiles the committed schema and does not regenerate it,
            so nothing reaches npm until this merges and a release is cut.

            ---

            CI does not run automatically on a `GITHUB_TOKEN`-opened PR, so this
            one dispatches its own run against the branch. `typecheck` and
            `build` also ran against this schema in the job that opened it —
            see the linked run.

      # Give the drift PR a real CI status. Without this it shows only CodeQL,
      # so it looks unverified and nothing signals that it needs attention.
      - name: Run CI on the drift branch
        if: steps.drift-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref chore/client-schema-sync
