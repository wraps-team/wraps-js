# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    # Root only. This is a pnpm workspace, so the root lockfile covers every
    # package -- adding "**/*" makes Dependabot ALSO open a per-package PR for
    # the same dependency, and a bump applied to one package but not the rest
    # leaves two copies of a transitive dep in the tree and fails typecheck.
    directory: "/"
    schedule:
      interval: "weekly"
    # These packages are published libraries, so a declared range is a promise
    # to consumers. Only widen the floor when the new version falls outside the
    # existing range -- "^3.928.0" already permits @aws-sdk 3.1130.0, and
    # ratcheting it forces every consumer onto a newer AWS SDK for no gain.
    # The lockfile still moves, so CI keeps testing against current versions.
    versioning-strategy: "increase-if-necessary"
    groups:
      # AWS SDK clients must move together. Bumping one client alone pulls a
      # newer @smithy/types beside the version the other clients still pin, and
      # the two nominally-distinct Command types stop being assignable --
      # packages/email/src/events.ts fails to typecheck. Keep them in one PR.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      # vitest and its coverage provider are version-locked to each other, and
      # vitest also has a floor in pnpm-workspace.yaml. Split across two PRs,
      # one pairs coverage-v8 5 with vitest 4; worse, a vitest major that the
      # override still holds below installs the OLD version while the manifests
      # claim the new one, so CI goes green without testing the upgrade at all.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # These SDKs declare engines node >=20. Typechecking against a newer
      # @types/node lets tsc accept APIs that do not exist on the oldest
      # runtime we support, so major bumps here are a deliberate decision.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest is held below 5 by an override in pnpm-workspace.yaml, and
      # Dependabot cannot see pnpm overrides. A major bump therefore rewrites
      # the manifests to ^5 while the install stays on 4.x, and CI goes green
      # without ever running the new version. Moving to 5 means raising that
      # override deliberately; until then, stop proposing it.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # A TypeScript major is a toolchain migration, not a routine bump.
      # 7.0.2 made `pnpm typecheck` fail on both matrix legs -- packages/sms
      # reports TS2591 "Cannot find name 'process'" with the tsconfig `types`
      # and the @types/node dev dependency unchanged -- so the PR could never
      # merge. Decide the move to 7 deliberately; until then, stop re-opening
      # a permanently red PR each week, as with @types/node and vitest above.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
